<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Beeper Browser Connect</title>
<link rel="stylesheet" href="popup.css">
<main>
  <h1>Beeper Browser Connect</h1>
  <p>Use your signed-in browser account to connect a network to Beeper.</p>
  <label for="link">Pairing link from Grok</label>
  <textarea id="link" rows="3" spellcheck="false" placeholder="Open the pairing link, or paste it here."></textarea>
  <button id="review">Review connection</button>
  <section id="preview" hidden>
    <h2 id="provider"></h2>
    <p id="destination"></p>
    <p id="fields"></p>
    <p>The account signed in on this website will be connected. Switch accounts there first if needed. Session values are encrypted and sent directly to the Server; they are not put in chat.</p>
    <button id="connect">Open website and connect</button>
  </section>
  <p id="status" role="status"></p>
  <button id="cancel">Cancel handoff</button>
</main>
<script type="module" src="popup.mjs"></script></html>
