name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
  published-cli:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare pinned official CLI without installing Server
        run: python tests/prepare_official_cli.py --root "$GITHUB_WORKSPACE/.test-cli"
      - name: Run integration tests against synthetic loopback receiver
        env:
          BEEPER_TEST_CLI: ${{ github.workspace }}/.test-cli/bin/beeper
          BEEPER_TEST_CLI_CACHE: ${{ github.workspace }}/.test-cli/cache
          PYTHONPATH: tests:skills/beeper/scripts
        run: python -m unittest test_beeper.PublishedCLITests -v
